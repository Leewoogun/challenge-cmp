name: Android Firebase 배포

on:
    push:
        branches:
            - main
        paths-ignore:
            - '**.md'
            - 'docs/**'
            - 'iosApp/**'
    workflow_dispatch:
        inputs:
            groups:
                description: 'Firebase 테스터 그룹 alias (쉼표 구분)'
                required: true
                default: 'testers'
                type: string
            release_notes:
                description: '릴리스 노트 (비우면 fastlane/release_notes.txt 사용)'
                required: false
                type: string

# 연달아 push 되면 이전 빌드는 취소하고 최신 커밋만 배포한다.
concurrency:
    group: android-distribution-${{ github.ref }}
    cancel-in-progress: true

jobs:
    distribute:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - uses: gradle/actions/setup-gradle@v4

            - uses: ruby/setup-ruby@v1
              with:
                  ruby-version: '3.3'
                  bundler-cache: true

            - name: Restore secrets
              env:
                  GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
                  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
                  FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
                  KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
                  KAKAO_INVITE_TEMPLATE_ID: ${{ secrets.KAKAO_INVITE_TEMPLATE_ID }}
              run: |
                  echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > composeApp/google-services.json
                  echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
                  echo "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 -d > "$RUNNER_TEMP/firebase_service_account.json"
                  # challenge_api_base_url_* 는 넣지 않는다 — release 는 Constants 가 운영 서버로 고정한다.
                  {
                    echo "kakao_native_app_key=$KAKAO_NATIVE_APP_KEY"
                    echo "kakao_invite_template_id=$KAKAO_INVITE_TEMPLATE_ID"
                  } > local.properties

            - name: Build & distribute
              env:
                  KEYSTORE_FILE: ${{ runner.temp }}/release.jks
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
                  FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
                  FIREBASE_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/firebase_service_account.json
                  TESTER_GROUPS: ${{ inputs.groups || 'testers' }}
                  RELEASE_NOTES: ${{ inputs.release_notes }}
                  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
                  VERSION_CODE: ${{ github.run_number }}
                  BRANCH_NAME: ${{ github.ref_name }}
              run: bundle exec fastlane distribute

            - name: Clean up secrets
              if: always()
              run: |
                  rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/firebase_service_account.json"
                  rm -f composeApp/google-services.json local.properties
