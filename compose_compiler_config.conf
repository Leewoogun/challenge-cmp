// Compose 안정성 설정 — 여기 등록된 타입은 Compose 컴파일러가 stable 로 취급한다.
//
// :domain:model 은 challengeKotlinMultiplatformPure (Compose 컴파일러 미적용) 라
// 도메인 모델이 기본 추론상 unstable 이 된다. 화면이 도메인 모델을 그대로 받을 수 있도록
// stable 로 선언한다. 등록 전제는 "모든 프로퍼티가 val + 불변" — 가변 필드를 추가하면
// 이 선언이 거짓이 되어 UI 가 갱신되지 않으므로 주의.
//
// 문법: `*` 는 해당 패키지 1단계, `**` 는 하위 패키지까지 포함.
com.lwg.challenge.domain.model.**

// 값 타입이지만 Compose 컴파일러가 알 수 없는 외부 라이브러리 클래스.
kotlin.time.Instant
kotlin.time.Duration
kotlinx.collections.immutable.*

// 모든 프로퍼티가 val 인 값 타입 (ByteArray 는 참조가 고정되고 내용을 바꾸지 않는다).
com.lwg.challenge.camera.CapturedPhoto
